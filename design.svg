  <path d="M8 110 40 59 94 21 159 13 215 43 250 101 246 164 198 208 124 218 56 188 18 155Z" fill="url(#dots)"/>
  <path d="m37 67 53-34 41 9 30 39-22 49-70 11-42-25Z" fill="#ad5c56"/>
