<rect x="541" y="133" width="445" height="359" fill="url(#stars)" opacity=".8"/>
<text x="65" y="181" class="caps light">01 / SPACE SCIENCE</text>
<text x="63" y="259" class="hero">Hera reveals</text>
<text x="63" y="327" class="hero">DART crater</text>
<text x="65" y="393" font-size="30" class="light">Dimorphos bears a stadium-sized</text>
<text x="65" y="429" font-size="30" class="light">crater from the 2022 impact.</text>
