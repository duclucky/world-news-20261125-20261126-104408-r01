<text x="41" y="1001" font-size="19" letter-spacing="3" font-weight="bold">THE DAILY WORLD BRIEF</text>
<text x="984" y="1001" text-anchor="end" font-size="19" letter-spacing="3" font-weight="bold">ILLUSTRATED EDITION</text>
