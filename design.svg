<circle cx="711" cy="271" r="5" fill="#fff4dc"/>
<text x="578" y="218" font-size="25" font-weight="bold" class="light">CRATER</text>

<path d="M38 514H986 M512 514V966 M38 746H986 M38 966H986" stroke="#17263a" stroke-width="3"/>
<text x="43" y="553" class="caps">02 / GLOBAL TRADE</text>
<text x="42" y="614" class="headline">U.S. proposes tariffs</text>
<text x="42" y="663" class="headline">on 14 economies</text>
<text x="43" y="710" font-size="30">China and EU included.</text>
<g transform="translate(432 679)" stroke="#17263a" stroke-width="4" stroke-linejoin="round">
  <path d="M-32-11 0-28 32-11 0 7Z" fill="#ffd49d"/>
