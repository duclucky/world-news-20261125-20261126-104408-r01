<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
<title id="title">World in Five — 25 November 2026</title>
<defs>
  <pattern id="stars" width="83" height="71" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="18" r="1.7" fill="#9db0c5"/><circle cx="63" cy="47" r="1" fill="#c7d9eb"/>
  </pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="1.4" fill="#44273a" opacity=".23"/>
  </pattern>
  <linearGradient id="rock" x2="1" y2="1" gradientUnits="objectBoundingBox">
    <stop stop-color="#fff0c9"/><stop offset="1" stop-color="#cc765c"/>
  </linearGradient>
  <style>
    text{font-family:Arial,sans-serif;fill:#17263a}
    .caps{font-size:24px;letter-spacing:2.5px;font-weight:bold}
    .headline{font-size:42px;font-weight:bold;letter-spacing:-1.5px}
    .hero{font-size:64px;font-weight:bold;letter-spacing:-2px;fill:#fff4dc}
    .light{fill:#f9f0dd}
  </style>
</defs>
<rect width="1024" height="1024" fill="#f8f0dc"/>
<rect x="38" y="26" width="948" height="5" fill="#17263a"/>
<text x="40" y="104" font-size="81" font-weight="bold" letter-spacing="-5">World in Five</text>
