<text x="532" y="843" class="headline">Japan &amp; Singapore</text>
<text x="532" y="892" class="headline">plan naval drills</text>
<text x="533" y="941" font-size="30">Regular joint exercises.</text>
<g transform="translate(934 911)" stroke="#17263a" stroke-width="4" stroke-linejoin="round">
