<text x="532" y="614" class="headline">Russian strikes</text>
<text x="532" y="663" class="headline">cut power</text>
<text x="533" y="710" font-size="30">Outages in five regions.</text>
<g transform="translate(915 651)" stroke="#17263a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
